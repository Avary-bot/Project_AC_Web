<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOPX - Manage Guest Reviews</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #fff;
      --text: #17171c;
      --muted: #777;
      --primary: #7c3aed;
      --soft: #f1efff;
      --line: #e7e7ef;
      --danger: #ef4444
    }

    [data-theme=dark] {
      --bg: #0d0d12;
      --card: #18181f;
      --text: #fff;
      --muted: #aaa;
      --soft: #282332;
      --line: #30303a
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #ffffffdd;
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
      padding: 14px 22px;
      display: flex;
      align-items: center;
      gap: 12px
    }

    [data-theme=dark] .nav {
      background: #111118dd
    }

    .logo {
      font-weight: 950;
      font-size: 24px
    }

    .logo span {
      color: var(--primary)
    }

    .nav-right {
      margin-left: auto;
      display: flex;
      gap: 8px
    }

    .btn {
      border: 0;
      border-radius: 11px;
      padding: 10px 14px;
      background: var(--soft);
      color: var(--text);
      cursor: pointer;
      text-decoration: none
    }

    .primary {
      background: var(--primary);
      color: white
    }

    .container {
      max-width: 1250px;
      margin: 30px auto;
      padding: 0 20px
    }

    .hero {
      background: linear-gradient(135deg, #171125, #4c1d95, #7c3aed);
      color: white;
      border-radius: 24px;
      padding: 28px
    }

    .hero h1 {
      margin: 5px 0;
      font-size: 35px
    }

    .hero p {
      color: #eee;
      margin: 0
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 20px 0
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px
    }

    .stat i {
      color: var(--primary);
      font-size: 22px
    }

    .stat h2 {
      margin: 12px 0 3px
    }

    .muted {
      color: var(--muted)
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px
    }

    .head {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px
    }

    .head h2 {
      margin: 0
    }

    .controls {
      margin-left: auto;
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .input,
    .select {
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      outline: 0
    }

    .table-wrap {
      overflow: auto
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px
    }

    th,
    td {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top
    }

    th {
      font-size: 13px;
      color: var(--muted)
    }

    .stars {
      color: #f59e0b;
      white-space: nowrap
    }

    .delete {
      border: 0;
      background: #fee2e2;
      color: #b91c1c;
      border-radius: 9px;
      padding: 9px 11px;
      cursor: pointer
    }

    .empty {
      text-align: center;
      padding: 45px;
      color: var(--muted)
    }

    @media(max-width:700px) {
      .stats {
        grid-template-columns: 1fr
      }

      .hero h1 {
        font-size: 28px
      }

      .container {
        padding: 0 12px
      }

      .nav {
        padding: 12px
      }

      .btn span {
        display: none
      }
    }
  </style>
</head>

<body>
  <nav class="nav">
    <a class="logo" href="dashboard.html">SHOP<span>X</span></a>
    <div class="nav-right">
      <a class="btn" href="dashboard.html"><i class="fa-solid fa-chart-line"></i> <span>Dashboard</span></a>
      <a class="btn" href="../product/index.html"><i class="fa-solid fa-store"></i> <span>Store</span></a>
      <button class="btn" onclick="toggleTheme()"><i id="themeIcon" class="fa-solid fa-moon"></i></button>
      <button class="btn primary" onclick="logoutUser();location.href='../auth/login.html'"><i
          class="fa-solid fa-right-from-bracket"></i> <span>Logout</span></button>
    </div>
  </nav>

  <main class="container">
    <section class="hero">
      <small>ADMIN MANAGEMENT</small>
      <h1>Manage Guest Reviews ⭐</h1>
      <p>Read, search, filter and remove customer product reviews.</p>
    </section>

    <section class="stats">
      <div class="stat"><i class="fa-solid fa-star"></i>
        <h2 id="totalReviews">0</h2>
        <div class="muted">Total Reviews</div>
      </div>
      <div class="stat"><i class="fa-solid fa-users"></i>
        <h2 id="totalGuests">0</h2>
        <div class="muted">Guests</div>
      </div>
      <div class="stat"><i class="fa-solid fa-ranking-star"></i>
        <h2 id="averageRating">0.0</h2>
        <div class="muted">Average Rating</div>
      </div>
    </section>

    <section class="panel">
      <div class="head">
        <h2>Guest Reviews</h2>
        <div class="controls">
          <input id="search" class="input" placeholder="Search product, guest or review...">
          <select id="rating" class="select">
            <option value="all">All ratings</option>
            <option value="5">5 stars</option>
            <option value="4">4 stars</option>
            <option value="3">3 stars</option>
            <option value="2">2 stars</option>
            <option value="1">1 star</option>
          </select>
          <select id="sort" class="select">
            <option value="new">Newest</option>
            <option value="old">Oldest</option>
            <option value="high">Highest rating</option>
            <option value="low">Lowest rating</option>
          </select>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Product</th>
              <th>Guest</th>
              <th>Rating</th>
              <th>Review</th>
              <th>Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="../js/app.js"></script>
  <script>
    if (!requireAdmin()) throw new Error("Admin access required");

    function allReviews() {
      const products = getProducts();
      const out = [];
      products.forEach(p => {
        (p.reviews || []).forEach((r, index) => {
          out.push({
            productId: p.id,
            productName: p.name || "Unknown Product",
            reviewIndex: index,
            userId: r.userId || "",
            user: r.user || "Guest",
            rating: Number(r.rating || 0),
            comment: r.comment || "",
            date: r.date || ""
          });
        });
      });
      return out;
    }

    function stars(n) {
      return "★".repeat(n) + "☆".repeat(5 - n);
    }

    function renderReviews() {
      let reviews = allReviews();
      const q = document.getElementById("search").value.toLowerCase().trim();
      const rating = document.getElementById("rating").value;
      const sort = document.getElementById("sort").value;

      reviews = reviews.filter(r => {
        const matchesText = !q || [r.productName, r.user, r.comment].join(" ").toLowerCase().includes(q);
        const matchesRating = rating === "all" || r.rating === Number(rating);
        return matchesText && matchesRating;
      });

      reviews.sort((a, b) => {
        if (sort === "high") return b.rating - a.rating;
        if (sort === "low") return a.rating - b.rating;
        const ad = new Date(a.date || 0), bd = new Date(b.date || 0);
        return sort === "old" ? ad - bd : bd - ad;
      });

      const all = allReviews();
      document.getElementById("totalReviews").textContent = all.length;
      document.getElementById("totalGuests").textContent = new Set(all.map(r => r.userId || r.user)).size;
      document.getElementById("averageRating").textContent =
        all.length ? (all.reduce((s, r) => s + r.rating, 0) / all.length).toFixed(1) : "0.0";

      const rows = document.getElementById("rows");
      if (!reviews.length) {
        rows.innerHTML = `<tr><td colspan="6" class="empty">No guest reviews found.</td></tr>`;
        return;
      }

      rows.innerHTML = reviews.map(r => `
    <tr>
      <td><b>${escapeHTML(r.productName)}</b></td>
      <td>👤 ${escapeHTML(r.user)}</td>
      <td><span class="stars">${stars(r.rating)}</span><br><small>${r.rating}/5</small></td>
      <td>${escapeHTML(r.comment)}</td>
      <td>${r.date ? new Date(r.date).toLocaleString() : "—"}</td>
      <td><button class="delete" onclick="removeReview(${Number(r.productId)},${r.reviewIndex})"><i class="fa-solid fa-trash"></i></button></td>
    </tr>
  `).join("");
    }

    function removeReview(productId, index) {
      if (!confirm("Delete this guest review?")) return;
      const products = getProducts();
      const product = products.find(p => Number(p.id) === Number(productId));
      if (!product || !product.reviews) return;
      product.reviews.splice(index, 1);
      saveProducts(products);
      renderReviews();
    }

    ["search", "rating", "sort"].forEach(id => {
      document.getElementById(id).addEventListener("input", renderReviews);
      document.getElementById(id).addEventListener("change", renderReviews);
    });

    renderReviews();
  </script>
</body>

</html>
